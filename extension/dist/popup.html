<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stayful Intelligence</title>
    <style>
      body { margin: 0; width: 320px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #2e3d2b; background: #f7f8f4; }
      .head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #fff; border-bottom: 1px solid #e4e7dc; }
      .logo { width: 24px; height: 24px; border-radius: 6px; background: #5d8156; color: #fff; font-weight: 800; display: grid; place-items: center; }
      .brand { font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #5d8156; }
      .body { padding: 14px; }
      .muted { color: #7a8274; font-size: 12px; }
      .cta { display: inline-block; margin-top: 10px; border: 0; border-radius: 999px; background: #5d8156; color: #fff; font-weight: 600; font-size: 13px; padding: 8px 14px; cursor: pointer; text-decoration: none; }
      .cta.secondary { background: #fff; color: #2e3d2b; border: 1px solid #e4e7dc; }
      input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 8px; border: 1px solid #e4e7dc; border-radius: 8px; font-size: 12px; }
      label { display: block; margin-top: 10px; font-weight: 600; font-size: 12px; }
      .err { color: #b3261e; font-size: 12px; margin-top: 6px; }
      .ok { color: #5d8156; font-size: 12px; margin-top: 6px; }
      details { margin-top: 12px; }
      summary { cursor: pointer; font-size: 12px; color: #7a8274; }
    </style>
  </head>
  <body>
    <div class="head"><span class="logo">S</span><span class="brand">Stayful Intelligence</span></div>
    <div class="body" id="app"><p class="muted">Loading…</p></div>
    <script src="popup.js"></script>
  </body>
</html>
